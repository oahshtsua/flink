# For the timing and check runs: errors, plus the fusion prototype's "Fusing chained run" lines,
# so run.sh can confirm the fusion build actually fused the chain.
rootLogger.level = ERROR
rootLogger.appenderRef.console.ref = console

logger.fusion.name = org.apache.flink.streaming.runtime.tasks.OperatorChain
logger.fusion.level = INFO
logger.fusion.additivity = false
logger.fusion.appenderRef.console.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %m%n
